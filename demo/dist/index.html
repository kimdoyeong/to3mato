<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff3e3"><title>To3mato</title><meta name="description" content="할 일 관리와 날짜별 계획 및 포모도로 시간 기록."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Poor+Story&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"></head>
<body>
<main class="app"><div class="work-shell"><nav class="tabs" aria-label="작업 영역 탭"></nav><section class="workspace" aria-label="작업 영역"><div class="workspace-heading"><span id="date-label"></span></div><div id="workspace-content"></div></section></div>
<aside class="execution" aria-label="실행 영역"><div class="execution-heading" style="display:none"><span class="live-tag" id="timer-status"></span></div><section class="timer-panel"><div class="tomato-illustration" aria-hidden="true"><svg viewBox="0 0 140 128"><ellipse cx="70" cy="118" rx="42" ry="6" fill="#4a3128" opacity=".09"/><path d="M70 32C52 20 14 27 12 67c-2 32 26 50 58 50s60-18 58-50c-2-40-40-47-58-35Z" fill="#ef5b43"/><path d="M70 32C52 20 14 27 12 67c-1 12 3 22 10 31 6-34 28-58 48-66Z" fill="#f8765f" opacity=".55"/><path d="M29 54c-3 8-3 15 0 22" stroke="#ffb5a5" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M70 40 51 43l9-11-17-7 19-3-4-13 12 10 11-10-4 13 19 3-17 7 9 11Z" fill="#69a84f"/><path d="M70 32c0-9 1-15 7-20" stroke="#4d8a3a" stroke-width="5" stroke-linecap="round" fill="none"/><g class="eyes"><ellipse class="eye" cx="49" cy="76" rx="5" ry="6" fill="#4a3128"/><ellipse class="eye" cx="91" cy="76" rx="5" ry="6" fill="#4a3128"/><circle cx="51" cy="73.5" r="1.8" fill="#fff"/><circle cx="93" cy="73.5" r="1.8" fill="#fff"/></g><ellipse cx="36" cy="88" rx="9" ry="5.5" fill="#ff8f7d" opacity=".75"/><ellipse cx="104" cy="88" rx="9" ry="5.5" fill="#ff8f7d" opacity=".75"/><path d="M62 87q8 10 16 0" fill="none" stroke="#4a3128" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2 id="focus-title" style="display:none"></h2><div class="clock" id="clock" role="timer" aria-label="남은 시간">25:00</div><div class="timer-track"><div id="timer-progress"></div></div><div class="timer-actions"><button class="primary" id="main-action"></button><button class="icon-button end-button" id="end-action" aria-label="집중 종료" title="집중 종료"></button></div></section><section class="today-section"><div class="section-heading"><h2>오늘 할 일 <span id="today-count" class="count"></span></h2><span id="today-estimate"></span></div><div id="today-list"></div></section><div class="daily-summary"><div><strong id="daily-total">0 <small>포모도로</small></strong></div><div id="daily-dots" class="daily-dots"></div></div></aside></main>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-heading"><h2 id="dialog-title">할 일 추가</h2><button type="button" class="icon-button" id="close-dialog" aria-label="닫기">✕</button></div><label>할 일 이름<input name="title" id="task-title" required maxlength="120" placeholder="예: 강의 수강 및 정리" autocomplete="off"></label><div class="form-grid"><label>예상 포모도로<select name="estimate" id="task-estimate"><option value="1">🍅 1 포모도로</option><option value="2">🍅 2 포모도로</option><option value="3">🍅 3 포모도로</option><option value="4">🍅 4 포모도로</option><option value="5">🍅 5 포모도로</option><option value="6">🍅 6 포모도로</option></select></label><label>예정일<input type="date" name="date" id="task-date"></label></div><label>프로젝트<select name="project" id="task-project"></select></label><div class="dialog-footer"><button type="button" id="delete-task" class="text-button">삭제</button><button class="primary" type="submit">저장</button></div></form></dialog><div class="toast" id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
