name: Release CI/CD

on:
  push:
    branches: ['release/*']
  pull_request:
    branches: ['main', 'release/*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Sign, notarize, publish to R2 and update website (release/<version> only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '1'

jobs:
  validate:
    name: Validate
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/check-release-branch.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop:
    name: macOS tests and package
    needs: validate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm run build
      - name: Browser and Electron tests
        run: npm run test:ui
      - name: Build unsigned test package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --dir --publish never
      - name: Packaged app smoke tests
        env:
          TO3MATO_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/To3mato.app/Contents/MacOS/To3mato
        run: npx playwright test tests/desktop.spec.ts tests/tray.spec.ts tests/migration.spec.ts tests/updater-desktop.spec.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  sign:
    name: Sign and notarize
    needs: [validate, desktop]
    if: >-
      startsWith(github.ref, 'refs/heads/release/') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APPLE_KEYCHAIN_PROFILE: to3mato-ci-notary
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set temporary keychain path
        run: echo "APPLE_KEYCHAIN=$RUNNER_TEMP/to3mato-notary.keychain-db" >> "$GITHUB_ENV"
      - name: Check required credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TO3MATO_SUPABASE_URL: ${{ vars.TO3MATO_SUPABASE_URL }}
          TO3MATO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TO3MATO_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const required = ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID'];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing GitHub Secrets: ${missing.join(', ')}`);
          // The publishable key ships inside the app, so both are repository variables.
          const variables = ['TO3MATO_SUPABASE_URL', 'TO3MATO_SUPABASE_PUBLISHABLE_KEY'];
          const unset = variables.filter((name) => !process.env[name]);
          if (unset.length) throw new Error(`Missing GitHub Variables: ${unset.join(', ')}`);
          JS
      - run: npm ci
      - name: Validate version and current branch head
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-branch.mjs --publish
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Store notarization credentials in a temporary keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$APPLE_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$APPLE_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$APPLE_KEYCHAIN"
          xcrun notarytool store-credentials "$APPLE_KEYCHAIN_PROFILE" --keychain "$APPLE_KEYCHAIN" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
      - name: Bundle the production Supabase configuration
        env:
          TO3MATO_SUPABASE_URL: ${{ vars.TO3MATO_SUPABASE_URL }}
          TO3MATO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TO3MATO_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run sync:configure
      - name: Build signed and notarized application, ZIP and DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac
      - name: Notarize DMG and finalize checksums
        run: npm run notarize:mac -- --wait
      - run: npm run release:verify
      - name: Check the signed app includes the Supabase configuration
        run: |
          node --input-type=module <<'JS'
          import asar from '@electron/asar';
          const archive = 'release/distribution/mac-arm64/To3mato.app/Contents/Resources/app.asar';
          const files = asar.listPackage(archive).map((file) => file.replaceAll('\\', '/'));
          if (!files.includes('/electron/supabase-config.json'))
            throw new Error('Signed app is missing electron/supabase-config.json');
          JS
      - name: Preserve verified release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-${{ github.run_id }}
          path: |
            release/distribution/*-arm64-mac.zip
            release/distribution/*-arm64-mac.zip.blockmap
            release/distribution/*-arm64.dmg
            release/distribution/latest-mac.yml
            release/distribution/release.json
            release/distribution/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30
      - name: Remove temporary notarization keychain
        if: always()
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ] && [ -f "$APPLE_KEYCHAIN" ]; then
            security delete-keychain "$APPLE_KEYCHAIN"
          fi

  publish:
    name: Publish app and website
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: to3mato-production-r2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download the verified files from the signing job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-release-${{ github.run_id }}
          path: release/distribution
      - name: Publish verified files and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)" = "$GITHUB_SHA"
          npm run release:upload
      - name: Prepare website from the published release
        env:
          SITE_RELEASE_DIR: release/distribution
        run: npm run site:prepare
      - name: Deploy production website
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)" = "$GITHUB_SHA"
          node --input-type=module -e 'import { ensureReleaseIsCurrent } from "./scripts/upload-release.mjs"; import fs from "node:fs"; await ensureReleaseIsCurrent(JSON.parse(fs.readFileSync("package.json")).version);'
          npx --yes wrangler@4.151.2 pages deploy website/cloudflare-dist --project-name to3mato --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true --force
      - name: Verify production website version, link and checksums
        env:
          SITE_RELEASE_DIR: release/distribution
        run: node scripts/verify-site-release.mjs
